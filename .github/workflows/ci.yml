name: "CI"

on:
  push:
    branches:
      - "main"
      - "master"
  pull_request:
    branches:
      - "main"
      - "master"
  workflow_dispatch:

jobs:
  validate:
    name: "Validate and lint (PDK)"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Install PDK"
        run: |
          . /etc/os-release
          wget -q "https://apt.puppet.com/puppet-tools-release-${VERSION_CODENAME}.deb"
          sudo dpkg -i "puppet-tools-release-${VERSION_CODENAME}.deb"
          sudo apt-get update -qq
          sudo apt-get install -y pdk
          echo "/opt/puppetlabs/pdk/bin" >> "$GITHUB_PATH"

      - name: "pdk validate (metadata, puppet-lint, rubocop, epp)"
        run: "pdk validate --format text --puppet-version 8"

  unit:
    name: "Unit tests (Puppet ${{ matrix.puppet }})"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        puppet:
          - "7"
          - "8"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Install PDK"
        run: |
          . /etc/os-release
          wget -q "https://apt.puppet.com/puppet-tools-release-${VERSION_CODENAME}.deb"
          sudo dpkg -i "puppet-tools-release-${VERSION_CODENAME}.deb"
          sudo apt-get update -qq
          sudo apt-get install -y pdk
          echo "/opt/puppetlabs/pdk/bin" >> "$GITHUB_PATH"

      - name: "pdk test unit"
        run: "pdk test unit --puppet-version ${{ matrix.puppet }}"
